name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the superseded run (fewer runs and
# failure e-mails). Pushes to main are never cancelled: every commit there
# keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build frontend placeholder
        run: mkdir -p internal/platform/webui/dist && touch internal/platform/webui/dist/.gitkeep
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Test
        run: go test -race -count=1 ./...
      # The ee/ wiring in cmd/server is only built with the "ee" tag (ADR 0017),
      # so the edition with the licensed features gets its own vet and test run.
      - name: Vet and test the ee edition
        run: |
          go vet -tags ee ./...
          go test -race -count=1 -tags ee ./cmd/server/... ./ee/...
      - name: Generated TypeScript types and backend messages are up to date
        run: |
          go install github.com/gzuidhof/tygo@latest
          go run ./scripts/tygoconfig -o .tygo.generated.yaml
          tygo generate --config .tygo.generated.yaml
          go run ./scripts/servermessages
          cd web && npm ci --no-audit --no-fund && npx prettier --write src/shared/api-client/generated >/dev/null
          test -z "$(git status --porcelain -- src/shared/api-client/generated ../ee/web/src/generated)" || { git status --short -- src/shared/api-client/generated ../ee/web/src/generated; exit 1; }
      - name: Deploy script (stubbed git and docker)
        run: bash scripts/deploy/deploy_test.sh
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.build.yaml config -q
          docker compose -f compose.yaml -f compose.proxy.example.yaml config -q
      - name: OpenAPI fragments merge into a valid document
        run: go run ./scripts/openapi -o dist/openapi.yaml
      - name: Keep the merged OpenAPI document
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: dist/openapi.yaml
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Frontend of ee/ (ADR 0021): a separate package that the web app loads as
  # a plugin. It imports the plugin API types from web/, so both get their
  # dependencies.
  ee-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ee/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            ee/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Browser extension (#65): the extension itself has no dependencies; its
  # local mode (ADR 0019) bundles the web app, built here from web/. Tests,
  # manifest lint (minimal permissions, files, syntax, no remote code), the
  # zip and its size budget.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build:extension
        working-directory: web
      - run: node scripts/app.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-extension
          path: extension/dist/*.zip
          retention-days: 14

  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: make build
      # The extension spec (#291) loads the extension with the local-mode app.
      - run: cd web && npm run build:extension && cd ../extension && node scripts/app.mjs
      - run: cd web && npx playwright test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t waylight:ci .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Measure footprint (bundle, binary, image, idle memory)
        id: measure
        run: |
          docker build --target web -t waylight:web .
          web=$(docker create waylight:web) && docker cp "$web:/src/internal/platform/webui/dist" dist && docker rm "$web"
          app=$(docker create waylight:ci) && docker cp "$app:/waylight" waylight.bin && docker rm "$app"
          echo "image=$(docker image inspect -f '{{.Size}}' waylight:ci)" >> "$GITHUB_OUTPUT"
          # A regular instance, as users run it; the demo carries far more
          # example data and integrations since #549.
          docker run -d --name idle -e SECRET_KEY="$(openssl rand -base64 32)" waylight:ci
          sleep 60
          echo "memory=$(docker stats --no-stream --format '{{.MemUsage}}' idle)" >> "$GITHUB_OUTPUT"
          docker rm -f idle
      - name: Download the measurements of main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success -L 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ]; then gh run download "$id" -R "$GITHUB_REPOSITORY" -n budget-measurements -D baseline || true; fi
      - name: Check resource budgets
        run: |
          go run ./scripts/budgets -dist dist -binary waylight.bin \
            -image-bytes "${{ steps.measure.outputs.image }}" -memory "${{ steps.measure.outputs.memory }}" \
            -baseline baseline/measurements.json -out measurements.json
      - name: Keep the measurements for comparisons
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budget-measurements
          path: measurements.json
          retention-days: 90
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: waylight:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # Code scanning is only available while the repository is public; the
      # next step still fails the build on fixable critical findings.
      - name: Upload scan results
        if: always() && !github.event.repository.private && hashFiles('trivy.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: waylight:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  # Native .deb packages (ADR 0015): build, lifecycle test in Debian and a real
  # start under systemd with the hardened unit.
  package:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      NFPM_VERSION: v2.47.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build packages (amd64, arm64)
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
          (cd web && npm ci --no-audit --no-fund)
          make package NFPM="$(go env GOPATH)/bin/nfpm"
          ls -l dist
      - name: Install, upgrade, remove and purge in Debian Trixie
        run: docker run --rm -v "$PWD:/src:ro" -w /src debian:trixie sh packaging/test/package-test.sh dist/waylight_*_amd64.deb
      - name: APT repository round trip (throwaway signing key)
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --passphrase '' --quick-gen-key 'CI <ci@example.invalid>' ed25519 sign 1d
          fpr=$(gpg --list-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          APT_SIGNING_KEY_ID="$fpr" sh scripts/apt-repo.sh "$RUNNER_TEMP/apt" dist/*.deb
          docker run --rm -v "$RUNNER_TEMP/apt:/repo:ro" debian:trixie sh -euc '
            echo "deb [signed-by=/repo/waylight-archive-keyring.asc] file:///repo stable main" >/etc/apt/sources.list.d/waylight.list
            apt-get update -qq
            apt-get install -y -qq waylight >/dev/null
            waylight version'
      - name: Start the service under systemd
        run: |
          sudo apt-get install -y ./dist/waylight_*_amd64.deb
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8090/healthz >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/healthz
          # Type=notify: "active" means the binary sent READY=1.
          systemctl is-active waylight
          test "$(systemctl show -p Type --value waylight)" = notify
          sleep 2
          test "$(systemctl show -p WatchdogTimestampMonotonic --value waylight)" -gt 0
          sudo journalctl -u waylight --no-pager | grep -q setup_token
          test "$(sudo stat -c '%U:%G %a' /etc/waylight/secret.env)" = "root:waylight 640"
      - name: Setup token on a headless device, then the setup itself
        run: |
          token=$(sudo sed -n 's/^SETUP_TOKEN=//p' /etc/waylight/secret.env)
          sudo waylight-setup-token | tee /dev/stderr | grep -q "Token  $token"
          sudo journalctl -u waylight --no-pager | grep -q "setup_token=$token"
          # The timer's oneshot writes the console snippet inside its own sandbox.
          sudo systemctl start waylight-setup-info.service
          grep -q "$token" /etc/issue.d/waylight.issue
          sudo mkdir -p /tmp/boot && sudo env WAYLIGHT_BOOT_DIR=/tmp/boot /usr/lib/waylight/waylight-setup-info
          grep -q "$token" /tmp/boot/waylight-setup.txt
          test "$(waylight setup-status)" = pending
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"setupToken\":\"$token\",\"password\":\"correct horse battery staple\"}" \
            http://127.0.0.1:8090/api/auth/setup >/dev/null
          test "$(waylight setup-status)" = done
          sudo systemctl start waylight-setup-info.service
          sudo env WAYLIGHT_BOOT_DIR=/tmp/boot /usr/lib/waylight/waylight-setup-info
          test ! -e /etc/issue.d/waylight.issue
          test ! -e /tmp/boot/waylight-setup.txt
          ! systemctl is-enabled --quiet waylight-setup-info.timer
          sudo waylight-setup-token | grep -q "already set up"
      - name: Check the unit and its sandbox (exposure must stay at or below 2.0)
        run: |
          systemd-analyze verify /usr/lib/systemd/system/waylight.service \
            /usr/lib/systemd/system/waylight-setup-info.service /usr/lib/systemd/system/waylight-setup-info.timer
          # --threshold is the exposure × 10 (default 100 = 10.0): 20 = 2.0.
          systemd-analyze security waylight --threshold=20 --no-pager
      - name: Service log
        if: failure()
        run: sudo journalctl -u waylight --no-pager -n 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          retention-days: 14

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build frontend placeholder
        run: mkdir -p internal/platform/webui/dist && touch internal/platform/webui/dist/.gitkeep
      - name: govulncheck (fails on reachable vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: npm audit (runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
