# Family: what a household shares: the meal plan, chores, board, parcels
# and waste collection sit in Today. The weather takes the location asked for
# when the template is applied (#589). The tab is zoned (#619): Today, My
# things and, for admins, System. Widgets with a compact view are small or a
# strip (#595); the services strip feeds the attention line (#593).
id: family
title: Family
needs: [location]
tab:
  name: Family
  zones: true
  widgets:
    - kind: weather
      at: { x: 0, y: 0, w: 3, h: 2 }
      size: small
      zone: today
      phone: { order: 1, rows: 2, size: small }
    - kind: todos
      at: { x: 3, y: 0, w: 3, h: 2 }
      size: small
      zone: today
      phone: { order: 2, rows: 2, size: small }
    - kind: calendar
      at: { x: 6, y: 0, w: 6, h: 1 }
      size: strip
      zone: today
      phone: { order: 3, rows: 1, size: strip }
      config: { view: agenda, days: 7 }
    - kind: waste
      at: { x: 6, y: 1, w: 3, h: 2 }
      size: small
      zone: today
      phone: { order: 4, rows: 2, size: small }
    - kind: parcels
      at: { x: 9, y: 1, w: 3, h: 2 }
      size: small
      zone: today
      phone: { order: 5, rows: 2, size: small }
    - kind: meals
      at: { x: 0, y: 3, w: 3, h: 2 }
      size: small
      zone: today
      phone: { order: 6, rows: 2, size: small }
    - kind: chores
      at: { x: 3, y: 3, w: 3, h: 2 }
      size: small
      zone: today
      phone: { order: 7, rows: 2, size: small }
    - kind: board
      at: { x: 6, y: 3, w: 3, h: 2 }
      size: small
      zone: today
      phone: { order: 8, rows: 2, size: small }
    - kind: shopping
      at: { x: 0, y: 5, w: 4, h: 4 }
      size: medium
      zone: mine
      phone: { order: 9, rows: 4 }
    - kind: birthdays
      at: { x: 4, y: 5, w: 4, h: 4 }
      size: medium
      zone: mine
      phone: { order: 10, rows: 3 }
    - kind: notes
      at: { x: 8, y: 5, w: 4, h: 4 }
      size: medium
      zone: mine
      phone: { order: 11, rows: 4 }
      config: { scope: pinned }
    - kind: services
      at: { x: 0, y: 9, w: 6, h: 1 }
      size: strip
      zone: system
      phone: { order: 12, rows: 1, size: strip }
