# Family: what a household shares. The weather takes the location asked for
# when the template is applied (#589).
id: family
title: Family
needs: [location]
tab:
  name: Family
  widgets:
    - kind: calendar
      at: { x: 0, y: 0, w: 5, h: 6 }
      phone: { order: 1, rows: 5 }
      config: { view: agenda, days: 7 }
    - kind: weather
      at: { x: 5, y: 0, w: 4, h: 4 }
      phone: { order: 2, rows: 3, size: medium }
    - kind: shopping
      at: { x: 9, y: 0, w: 3, h: 6 }
      phone: { order: 3, rows: 4 }
    - kind: waste
      at: { x: 5, y: 4, w: 4, h: 2 }
      phone: { order: 4, rows: 2, size: medium }
    - kind: birthdays
      at: { x: 0, y: 6, w: 5, h: 3 }
      phone: { order: 5, rows: 3 }
