# Wall tablet: large and readable from across the room. Kiosk mode and night
# dimming are set on the kiosk display itself (#589). The tab is zoned
# (#619) with large tiles; the System zone shows only to admins. Every row
# of a zone adds up to the 12 columns (#793), so the departures sit in Today
# next to the agenda and the services span the full width.
id: wall
title: Wall tablet
needs: [location]
tab:
  name: Wall
  zones: true
  widgets:
    - kind: tonight
      at: { x: 0, y: 0, w: 6, h: 4 }
      zone: today
      phone: { order: 1, rows: 4 }
    - kind: weather
      at: { x: 6, y: 0, w: 6, h: 4 }
      zone: today
      phone: { order: 2, rows: 4 }
    - kind: calendar
      at: { x: 0, y: 4, w: 6, h: 6 }
      size: large
      zone: today
      phone: { order: 3, rows: 5 }
      config: { view: agenda, days: 3 }
    - kind: transit
      at: { x: 6, y: 4, w: 6, h: 6 }
      size: large
      zone: today
      phone: { order: 4, rows: 4 }
    - kind: birthdays
      at: { x: 0, y: 10, w: 6, h: 4 }
      zone: today
      phone: { order: 5, rows: 4 }
    - kind: countdown
      at: { x: 6, y: 10, w: 6, h: 4 }
      zone: today
      phone: { order: 6, rows: 4 }
    - kind: services
      at: { x: 0, y: 14, w: 12, h: 3 }
      zone: system
      phone: { order: 7, rows: 3 }
