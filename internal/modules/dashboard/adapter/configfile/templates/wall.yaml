# Wall tablet: large and readable from across the room. Kiosk mode and night
# dimming are set on the kiosk display itself (#589).
id: wall
title: Wall tablet
needs: [location]
tab:
  name: Wall
  widgets:
    - kind: clock
      at: { x: 0, y: 0, w: 6, h: 4 }
      phone: { order: 1, rows: 3 }
      config: { showDate: true, showSeconds: false }
    - kind: weather
      at: { x: 6, y: 0, w: 6, h: 4 }
      phone: { order: 2, rows: 4 }
    - kind: calendar
      at: { x: 0, y: 4, w: 6, h: 5 }
      phone: { order: 3, rows: 5 }
      config: { view: agenda, days: 3 }
    - kind: transit
      at: { x: 6, y: 4, w: 6, h: 5 }
      phone: { order: 4, rows: 4 }
