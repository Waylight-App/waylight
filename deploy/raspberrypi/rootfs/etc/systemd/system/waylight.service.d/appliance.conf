# Raspberry Pi image (ADR 0015).
[Service]
# Listening on port 80 is the only extra privilege.
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
# Image defaults go between the generated secrets and the admin's file, so
# that waylight.env still wins.
EnvironmentFile=
EnvironmentFile=-/etc/waylight/secret.env
EnvironmentFile=/etc/waylight/appliance.env
EnvironmentFile=/etc/waylight/waylight.env
