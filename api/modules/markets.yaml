tags:
  - name: markets

paths:
  /api/markets/watchlist:
    get:
      tags: [markets]
      summary: "Latest value, change against the previous close and 30 days of closes for up to 12 symbols (#284): fx:USD (ECB euro reference rates) or stooq:aapl.us (Stooq: shares, indices, crypto). Cached for an hour; a failing source shows the last value (stale)"
      parameters:
        - { name: symbols, in: query, required: true, schema: { type: string }, description: "Comma-separated, e.g. fx:USD,stooq:^dax,stooq:btcusd" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    symbol: { type: string }
                    value: { type: number, nullable: true }
                    changePct: { type: number }
                    asOf: { type: string, format: date }
                    history: { type: array, items: { type: object, properties: { day: { type: string, format: date }, value: { type: number } } } }
                    stale: { type: boolean }
                    error: { type: string }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/markets/rates:
    get:
      tags: [markets]
      summary: "Newest ECB euro reference rates for currency conversion in the search (#482); fetched at most once a day. When the ECB cannot be reached, the last rates are returned with stale = true"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  base: { type: string, example: EUR }
                  date: { type: string, format: date }
                  rates: { type: object, additionalProperties: { type: number }, example: { EUR: 1, USD: 1.08 } }
                  stale: { type: boolean }
        "404": { description: "Currency rates are switched off (CURRENCY_RATES=false)" }
        "503": { description: "No rates fetched yet and the ECB cannot be reached" }
