paths:
  /api/auth/status:
    get:
      tags: [auth]
      summary: Setup and login state of the caller (public)
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } } }
  /api/auth/setup:
    post:
      tags: [auth]
      summary: Create the account with the setup token from the server log (public)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SetupRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { description: Invalid setup token, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: Already set up, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in (public, rate limited per client IP)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Setup required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/app-sessions:
    post:
      tags: [auth]
      summary: Sign an app in with the login fields or a pairing code (public, rate limited like the login); the bearer token is returned once (#559)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppSessionRequest" } } } }
      responses:
        "201": { description: App session created, content: { application/json: { schema: { $ref: "#/components/schemas/AppSession" } } } }
        "202": { description: Second factor required; repeat with code }
        "401": { description: Invalid credentials or pairing code, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/app-sessions/pairing-code:
    post:
      tags: [auth]
      summary: Single-use pairing code for the QR code under Settings → Apps; valid for five minutes, not for kiosk displays
      security: [{ session: [], csrf: [] }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PairingCode" } } } }
        "403": { description: Kiosk display, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Logged out }
  /api/auth/password:
    put:
      tags: [auth]
      summary: Change the password and sign out all other sessions
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangePasswordRequest" } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/auth/kiosk/login:
    post:
      tags: [auth]
      summary: Sign a kiosk display in with the token of its link (public, rate limited like the login); the page reads the token from the URL fragment, so it never reaches server logs (#50)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { description: Unknown, renewed or disabled link, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/kiosk:
    get:
      tags: [auth]
      summary: Display options of the signed-in kiosk (rotation, night dimming)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KioskOptions" } } } }
        "404": { description: Not a kiosk session }
  /api/auth/invites:
    get:
      tags: [auth]
      summary: Open invitations (admin only, #296); expired ones are dropped
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invite" } } } } }
    post:
      tags: [auth]
      summary: Invite a member or a guest; the link token is returned once and stored hashed
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, role, validDays], properties: { name: { type: string }, role: { type: string, enum: [member, guest] }, tabs: { type: array, items: { type: string } }, validDays: { type: integer, minimum: 1, maximum: 30 } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { invite: { $ref: "#/components/schemas/Invite" }, token: { type: string } } } } } }
        "409": { description: Name taken, members unavailable or at most 20 open invitations }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/auth/invites/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [auth]
      summary: Revoke an invitation
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Revoked }
  /api/auth/accounts/{id}/reset-link:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [auth]
      summary: Create a password reset link for a member or guest (admin only); replaces earlier ones, valid 24 hours. The admin's own password is reset on the server only.
      security: [{ session: [], csrf: [] }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { token: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
        "403": { description: Not an admin, or the account is the admin }
  /api/auth/link/inspect:
    post:
      tags: [auth]
      summary: What an invitation or reset link is for (public, rate limited like the login); the token comes from the URL fragment
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LinkInfo" } } } }
        "401": { description: Unknown, used or expired link }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/link/accept:
    post:
      tags: [auth]
      summary: Set the password of an invited or reset account and use up the link (public, rate limited); does not sign in
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LinkInfo" } } } }
        "401": { description: Unknown, used or expired link }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/link/sso:
    post:
      tags: [auth]
      summary: Accept an invitation through the OpenID provider instead of a password (#528; public, rate limited, needs a licence key with sso). Sets the state cookie and returns the provider URL; the callback creates the account, links the sign-in and signs in
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "200": { description: "{redirect}" }
        "401": { description: Unknown, used or expired invitation }
        "404": { description: Not available (no OIDC or no licence) }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/password-reset:
    post:
      tags: [auth]
      summary: Ask for a password reset link by e-mail (public, rate limited, #296). Answers 202 whether or not the name exists or has an address; the link goes only to the account's own address and uses PUBLIC_URL.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        "202": { description: Accepted }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { description: No e-mail channel or no PUBLIC_URL }
  /api/auth/email:
    get:
      tags: [auth]
      summary: The signed-in member's or guest's own address for reset links
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }
    put:
      tags: [auth]
      summary: Set or remove (empty) the own address for reset links; not for the admin or kiosks
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { email: { type: string } } } } } }
        "403": { description: The admin account or a kiosk }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/auth/kiosks:
    get:
      tags: [auth]
      summary: Kiosk displays (owner only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/KioskDisplay" } } } } }
    post:
      tags: [auth]
      summary: Create a kiosk display; the link token is returned once and stored hashed
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KioskRequest" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { kiosk: { $ref: "#/components/schemas/KioskDisplay" }, token: { type: string } } } } } }
        "409": { description: At most 10 displays }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/auth/kiosks/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [auth]
      summary: Change tabs, options or the disabled flag (disabling signs the device out)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KioskRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KioskDisplay" } } } }
        "404": { description: Unknown display }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [auth]
      summary: Delete a display and sign the device out
      security: [{ session: [], csrf: [] }]
      responses: { "204": { description: Deleted }, "404": { description: Unknown display } }
  /api/auth/kiosks/{id}/link:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [auth]
      summary: Replace the link; the old link and the device's session stop working
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } } }
        "404": { description: Unknown display }

schemas:
  AuthStatus:
    type: object
    required: [setupRequired, authenticated]
    properties:
      setupRequired: { type: boolean }
      authenticated: { type: boolean }
      csrfToken: { type: string }
      passwordReset: { type: boolean, description: Members and guests can ask for a reset link by e-mail (#296) }
  SetupRequest:
    type: object
    required: [setupToken, password]
    properties:
      setupToken: { type: string }
      password: { type: string, minLength: 12, maxLength: 256 }
      profile: { type: string, enum: [everyday, homelab], description: "What the start page shows (#281); everyday seeds no Server tab. Omitted = homelab" }
  AppSessionRequest:
    type: object
    required: [device]
    properties:
      device: { type: string, maxLength: 80, description: Name of the device, shown in the session overview }
      pairingCode: { type: string, description: Code from the QR code; replaces username, password and code }
      username: { type: string, description: Empty for the owner }
      password: { type: string }
      code: { type: string, description: TOTP or recovery code when the second factor is enabled }
  AppSession:
    type: object
    required: [token, device, expiresAt]
    properties:
      token: { type: string, description: "Bearer token (wa_…); only returned here" }
      device: { type: string }
      expiresAt: { type: string, format: date-time, description: Extended on use (90 days) }
  PairingCode:
    type: object
    required: [code, expiresAt]
    properties:
      code: { type: string }
      expiresAt: { type: string, format: date-time }
  LoginRequest:
    type: object
    required: [password]
    properties:
      password: { type: string }
      code: { type: string, description: TOTP or recovery code; required when 2FA is enabled (otherwise 422 with field "totpCode") }
  ChangePasswordRequest:
    type: object
    required: [currentPassword, newPassword]
    properties:
      currentPassword: { type: string }
      newPassword: { type: string, minLength: 12, maxLength: 256 }
  KioskOptions:
    type: object
    properties:
      rotateSeconds: { type: integer, description: "Seconds per tab, 10-3600; 0 = no rotation" }
      nightFrom: { type: string, example: "22:00", description: "HH:MM, empty = never dimmed" }
      nightTo: { type: string, example: "06:30" }
  KioskRequest:
    allOf:
      - $ref: "#/components/schemas/KioskOptions"
      - type: object
        properties:
          name: { type: string, description: 2-32 lowercase letters, digits, dots, dashes or underscores }
          tabs: { type: array, items: { type: string }, minItems: 1 }
          disabled: { type: boolean }
  Invite:
    type: object
    properties:
      id: { type: string }
      name: { type: string }
      role: { type: string, enum: [member, guest] }
      tabs: { type: array, items: { type: string } }
      createdAt: { type: string, format: date-time }
      expiresAt: { type: string, format: date-time }
  LinkInfo:
    type: object
    properties:
      purpose: { type: string, enum: [invite, reset] }
      name: { type: string }
      sso: { type: boolean, description: "The invitation can be accepted through the OpenID provider (#528)" }
  KioskDisplay:
    allOf:
      - $ref: "#/components/schemas/KioskOptions"
      - type: object
        properties:
          id: { type: string }
          name: { type: string }
          tabs: { type: array, items: { type: string } }
          disabled: { type: boolean }
          createdAt: { type: string, format: date-time }
          lastUsedAt: { type: string, format: date-time, nullable: true }
