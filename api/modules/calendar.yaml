tags:
  - name: calendar

paths:
  /api/calendar/compact:
    get:
      tags: [calendar]
      summary: "Compact state of the widget (#594): The next event"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CompactState" } } } }
  /api/calendar/settings:
    get:
      tags: [calendar]
      summary: CalDAV settings (the password is never returned)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettings" } } } }
    put:
      tags: [calendar]
      summary: Test and save the CalDAV connection (empty password keeps the stored one)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettingsInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSettings" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/calendar/connect:
    post:
      tags: [calendar]
      summary: "Setup assistant (#588): find the event calendars of an account from the server address (CalDAV discovery), check and save them; answers with the calendars and the next three events. Errors name the cause (key not accepted, nothing answers, not the expected service, untrusted certificate)."
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                server: { type: string, description: "Server root or DAV address, e.g. https://cloud.example.com" }
                username: { type: string }
                password: { type: string, description: App password }
                signIn: { type: string, description: "ID of a finished Nextcloud sign-in of the setup assistant (#654); replaces server, username and password" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [settings, calendars, next]
                properties:
                  settings: { $ref: "#/components/schemas/CalendarSettings" }
                  calendars:
                    type: array
                    items: { type: object, required: [url, name], properties: { url: { type: string }, name: { type: string } } }
                  next: { type: array, items: { type: object }, description: "Up to three events, shaped like Agenda.events" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/calendar/events:
    get:
      tags: [calendar]
      summary: Upcoming events (cached, refreshed every 15 minutes) or, with from/to, the events of a period of at most 42 days (month view)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 31, default: 7 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agenda" } } } }
        "404": { description: Not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { description: Invalid period, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    post:
      tags: [calendar]
      summary: Create an event in one of the configured calendars (CalDAV PUT with If-None-Match)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [calendarUrl, summary, start, end]
              properties:
                calendarUrl: { type: string, description: One of the configured calendar URLs }
                summary: { type: string, maxLength: 200 }
                location: { type: string, maxLength: 200 }
                allDay: { type: boolean }
                start: { type: string, description: "RFC 3339 instant, or YYYY-MM-DD for all-day events" }
                end: { type: string, description: "RFC 3339 instant, or YYYY-MM-DD (inclusive) for all-day events" }
      responses:
        "201": { description: Created }
        "422": { description: Validation error or unknown calendar, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/calendar/writable:
    get:
      tags: [calendar]
      summary: Calendars that accept new events (#282); id is a CalDAV URL or account:<account>:<calendar>, used as calendarUrl of POST /api/calendar/events
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } } } } }
  /api/calendar/accounts:
    get:
      tags: [calendar]
      summary: Connected Google and Microsoft accounts with their calendars, and the redirect address to register ("" without PUBLIC_URL); tokens are never returned
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarAccounts" } } } }
  /api/calendar/accounts/oauth/start:
    post:
      tags: [calendar]
      summary: Start signing in with the user's own app registration (OAuth authorization code with PKCE); answers the provider's sign-in address
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [provider, clientId], properties: { provider: { type: string, enum: [google, microsoft] }, clientId: { type: string }, clientSecret: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string }, state: { type: string } } } } } }
        "409": { description: 5 accounts are connected already }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/calendar/accounts/oauth/state/{state}:
    get:
      tags: [calendar]
      summary: Progress of a sign-in (pending, ready, failed)
      parameters: [{ name: state, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [pending, ready, failed] } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/calendar/accounts/oauth/callback:
    get:
      tags: [calendar]
      summary: Redirect target of the providers (public; the state ties it to a sign-in started here). Answers a small HTML page
      security: []
      responses:
        "200": { description: Signed in }
        "502": { description: The sign-in failed }
  /api/calendar/accounts/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [calendar]
      summary: Choose which calendars of the account are shown
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarAccount" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [calendar]
      summary: Disconnect; the token is revoked at the provider where it supports that (Google)
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Disconnected }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/calendar/subscriptions:
    get:
      tags: [calendar]
      summary: ICS subscriptions (#98); the URL is never returned, only a hint without path and query
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CalendarSubscription" } } } } }
    post:
      tags: [calendar]
      summary: Add an ICS subscription (the feed is loaded once to test it)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSubscriptionInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSubscription" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/calendar/subscriptions/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [calendar]
      summary: Update a subscription; an empty URL keeps the stored one
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSubscriptionInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarSubscription" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [calendar]
      summary: Delete a subscription
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The calendar server rejected the event, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

schemas:
  CalendarSubscription:
    type: object
    properties:
      id: { type: string }
      name: { type: string }
      urlHint: { type: string, example: "https://calendar.example.com/…" }
      color: { type: string, example: "#3b6ef5" }
      refreshMinutes: { type: integer }
  CalendarSubscriptionInput:
    type: object
    required: [name]
    properties:
      name: { type: string, maxLength: 60 }
      url: { type: string, description: "https://, http:// or webcal://; required when adding" }
      color: { type: string, description: "#rrggbb, default #3b6ef5" }
      refreshMinutes: { type: integer, minimum: 15, maximum: 1440, default: 60 }
  CalendarSettings:
    type: object
    properties:
      configured: { type: boolean }
      calendarUrls: { type: array, items: { type: string } }
      username: { type: string }
      hasPassword: { type: boolean }
  CalendarSettingsInput:
    type: object
    required: [calendarUrls, username, password]
    properties:
      calendarUrls: { type: array, maxItems: 10, items: { type: string, format: uri } }
      username: { type: string }
      password: { type: string, description: App password; empty keeps the stored one }
  Agenda:
    type: object
    properties:
      events:
        type: array
        items:
          type: object
          properties:
            uid: { type: string }
            summary: { type: string }
            location: { type: string }
            description: { type: string, description: Plain text, at most 2000 characters (#163) }
            url: { type: string, description: 'http(s) link of the event, empty otherwise (#163)' }
            calendar: { type: string, description: CalDAV collection or subscription name }
            color: { type: string, description: "Subscription colour (#rrggbb); empty for CalDAV calendars" }
            start: { type: string, description: RFC 3339, or YYYY-MM-DD for all-day events }
            end: { type: string, description: RFC 3339, or YYYY-MM-DD (exclusive) for all-day events }
            allDay: { type: boolean }
      updatedAt: { type: string, format: date-time }
      error: { type: string }
  CalendarAccount:
    type: object
    properties:
      id: { type: string }
      provider: { type: string, enum: [google, microsoft] }
      name: { type: string }
      calendars:
        type: array
        items: { type: object, properties: { id: { type: string }, name: { type: string }, color: { type: string }, writable: { type: boolean }, enabled: { type: boolean } } }
  CalendarAccounts:
    type: object
    properties:
      redirectUrl: { type: string }
      accounts: { type: array, items: { $ref: "#/components/schemas/CalendarAccount" } }
