tags:
  - name: appearance

paths:
  /api/appearance:
    get:
      tags: [appearance]
      summary: Visual preferences
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
    put:
      tags: [appearance]
      summary: Save visual preferences
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/appearance/background:
    put:
      tags: [appearance]
      summary: Set only the global background (#277), e.g. from the dashboard
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { backgroundImage: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/appearance/backgrounds:
    get:
      tags: [appearance]
      summary: Pictures uploaded as backgrounds, newest first, with the limits
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/UploadedBackground" } }, max: { type: integer }, maxUploadBytes: { type: integer } } } } } }
    post:
      tags: [appearance]
      summary: "Upload a background picture (JPEG, PNG or GIF, at most 25 MB) as the multipart field \"file\"; turned upright, scaled to at most 2560 px and stored as JPEG without EXIF data. At most 30 pictures"
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UploadedBackground" } } } }
        "409": { description: 30 pictures are stored already }
        "413": { description: Larger than 25 MB }
        "415": { description: Not multipart/form-data }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/appearance/backgrounds/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [appearance]
      summary: The picture as JPEG (?thumb=1 for a 320 px preview); cacheable, it never changes under its id
      parameters: [{ name: thumb, in: query, schema: { type: string, enum: ["1"] } }]
      responses:
        "200": { description: OK, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [appearance]
      summary: Delete a picture; if it is the global background, that falls back to the default
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/appearance/themes:
    get:
      tags: [appearance]
      summary: Theme gallery (#111) - built-in and imported themes, the applied one
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ThemeGallery" } } } }
    post:
      tags: [appearance]
      summary: Import a theme file (JSON, at most 16 KB; tokens only, unknown fields refused)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ThemeFile" } } } }
      responses:
        "201": { description: Imported (a taken id gets a suffix), content: { application/json: { schema: { $ref: "#/components/schemas/Theme" } } } }
        "413": { description: Larger than 16 KB }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/appearance/themes/restore:
    post:
      tags: [appearance]
      summary: Put back the custom CSS that applying a theme replaced
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
        "409": { description: Nothing to restore }
  /api/appearance/themes/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [appearance]
      summary: Export a theme as a shareable file
      responses:
        "200": { description: The theme file, content: { application/json: { schema: { $ref: "#/components/schemas/ThemeFile" } } } }
        "404": { description: Unknown theme }
    delete:
      tags: [appearance]
      summary: Delete an imported theme (built-in themes cannot be deleted)
      security: [{ session: [], csrf: [] }]
      responses: { "204": { description: Deleted }, "404": { description: Unknown theme }, "422": { $ref: "#/components/responses/Invalid" } }
  /api/appearance/themes/{id}/apply:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [appearance]
      summary: Apply a theme - writes its tokens as custom CSS and sets its scheme; own custom CSS is kept as a backup
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Appearance" } } } }
        "404": { description: Unknown theme }

schemas:
  Appearance:
    type: object
    required: [theme, accentColor, backgroundImage, customCss]
    properties:
      theme: { type: string, enum: [system, light, dark] }
      accentColor: { type: string, description: '#rrggbb or empty', pattern: '^(#[0-9a-fA-F]{6})?$' }
      backgroundImage: { type: string, description: "Empty (default), an http(s) image URL, /api/appearance/backgrounds/<id> (uploaded) or builtin:<name>" }
      customCss: { type: string, maxLength: 65536 }
      language: { type: string, enum: ["", en, de], description: '"" follows the browser' }
      greeting: { type: boolean, description: Greeting line below the top bar (#167), off by default }
      greetingName: { type: string, maxLength: 40, description: Name used in the greeting; may be empty }
      launcher: { type: string, enum: [both, services, bookmarks] }
      profile: { type: string, enum: [everyday, homelab], description: "What the start page shows (#281): everyday hides home-server and network widgets and settings. Empty on PUT keeps the stored value" }
  ThemeFile:
    type: object
    additionalProperties: false
    required: [id, name, scheme, tokens]
    properties:
      id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,39}$' }
      name: { type: string, maxLength: 40 }
      author: { type: string, maxLength: 60 }
      scheme: { type: string, enum: [light, dark] }
      tokens:
        type: object
        description: Design tokens (--color-bg, --color-surface, --color-surface-2, --color-border, --color-text, --color-text-muted, --color-accent, --color-accent-contrast, --color-danger, --color-success, --color-warning as #rgb/#rrggbb; --radius, --radius-small as 0-32px). bg, surface, text and accent are required.
        additionalProperties: { type: string }
  Theme:
    allOf:
      - $ref: "#/components/schemas/ThemeFile"
      - type: object
        properties:
          builtIn: { type: boolean }
  ThemeGallery:
    type: object
    properties:
      themes: { type: array, items: { $ref: "#/components/schemas/Theme" } }
      applied: { type: string, description: Id of the applied theme, "" for own or no custom CSS }
      canRestore: { type: boolean }
  UploadedBackground:
    type: object
    properties:
      id: { type: string }
      url: { type: string, description: Value to store as background }
      thumb: { type: string }
      width: { type: integer }
      height: { type: integer }
      size: { type: integer }
