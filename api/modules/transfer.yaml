tags:
  - name: transfer

paths:
  /api/transfer/export:
    get:
      tags: [transfer]
      summary: Download all user data (layout, bookmarks, notes, to-dos, feeds, services, settings) as a versioned JSON file; never contains secrets
      responses: { "200": { description: "Export file (format waylight-export, version, exportedAt, sections)" } }
  /api/transfer/import:
    post:
      tags: [transfer]
      summary: Import an export file (max. 16 MB). Each contained section replaces the module's data atomically; sections of disabled modules are skipped
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { format: { type: string, enum: [waylight-export] }, version: { type: integer }, sections: { type: object } } } } } }
      responses:
        "200": { description: "Result (imported, skipped, failed with reasons)" }
        "422": { description: Not an export file, unsupported version or too large }
  /api/transfer/config:
    get:
      tags: [transfer]
      summary: "Download the settings as waylight.yaml (#88): appearance, search, manual services, bookmarks and dashboard, semantic (names instead of IDs) and without secrets"
      responses:
        "200": { description: The YAML file, content: { application/yaml: { schema: { type: string } } } }
    post:
      tags: [transfer]
      summary: "Apply a waylight.yaml (max. 2 MB); sections managed by CONFIG_FILE are reported as failed. ${NAME} in strings is read from the environment. The whole file is checked first (YAML, version, known sections and fields, variables); then each present section replaces its module's settings atomically, sections missing from the file stay unchanged"
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/yaml: { schema: { type: string } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { applied: { type: array, items: { type: string } }, failed: { type: object, additionalProperties: { type: string } } } } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/transfer/config/status:
    get:
      tags: [transfer]
      summary: Sections managed by CONFIG_FILE (#88); they are applied at every start and refuse changes with 409
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { managed: { type: array, items: { type: string } } } } } } }
  /api/transfer/import/{format}:
    post:
      tags: [transfer]
      summary: "Import another dashboard (#77): format homepage (services.yaml, bookmarks.yaml, widgets.yaml) or homarr (board JSON of Homarr 0.x), as multipart parts named file, together at most 2 MB. Only adds: tiles with a new name, bookmarks with a new URL and, once, a tab named after the source. Without ?apply=true it is a preview that changes nothing"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { name: format, in: path, required: true, schema: { type: string, enum: [homepage, homarr] } }
        - { name: apply, in: query, schema: { type: string, enum: ["true"] } }
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, properties: { file: { type: array, items: { type: string, format: binary } } } } } }
      responses:
        "200":
          description: The changed parts of waylight.yaml, a summary with warnings, and the result when applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  yaml: { type: string }
                  summary: { type: object, properties: { tiles: { type: integer }, bookmarks: { type: integer }, widgets: { type: integer }, skipped: { type: integer }, tab: { type: string }, warnings: { type: array, items: { type: string } } } }
                  result: { type: object, properties: { applied: { type: array, items: { type: string } }, failed: { type: object, additionalProperties: { type: string } } } }
        "415": { description: Not multipart/form-data }
        "422": { $ref: "#/components/responses/Invalid" }
