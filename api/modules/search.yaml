tags:
  - name: search

paths:
  /api/search:
    get:
      tags: [search]
      summary: Redirect to the search result page (custom shortcuts, URLs, default provider)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 1000 } }
      responses:
        "302": { description: Redirect to the provider, headers: { Location: { schema: { type: string, format: uri } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/answers:
    get:
      tags: [search]
      summary: Answers of the smart search (ADR 0026) - up to three, in the client's language
      description: Only modules the account may read answer; guests are refused.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
        - { name: lang, in: query, required: false, description: 'en or de; else Accept-Language, else en', schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SearchAnswers" } } } }
        "403": { description: Guests cannot use the smart search, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/search/opensearch.xml:
    get:
      tags: [search]
      summary: OpenSearch description for browsers (public)
      security: []
      responses:
        "200": { description: OK, content: { application/opensearchdescription+xml: { schema: { type: string } } } }
  /api/search/settings:
    get:
      tags: [search]
      summary: Default provider, available providers and custom shortcuts
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
    put:
      tags: [search]
      summary: Choose the default provider
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DefaultProvider" } } } }
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/bar:
    put:
      tags: [search]
      summary: Options of the search field (#221) - open web results in a new tab, quick capture prefixes
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SearchBar" } } } }
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/shortcuts:
    post:
      tags: [search]
      summary: Add a custom shortcut such as !gh
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Shortcut" } } } }
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "409": { description: Keyword already used, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/shortcuts/{keyword}:
    delete:
      tags: [search]
      summary: Delete a custom shortcut
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: keyword, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/search/keywords:
    post:
      tags: [search]
      summary: Add an own keyword that opens a service, bookmark, widget, web address or search
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SearchKeyword" } } } }
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "409": { description: Keyword already used, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/search/keywords/{keyword}:
    delete:
      tags: [search]
      summary: Delete an own keyword
      security: [{ session: [], csrf: [] }]
      parameters: [{ name: keyword, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/SearchSettings" }
        "404": { $ref: "#/components/responses/NotFound" }

schemas:
  SearchKeyword:
    type: object
    required: [keyword, kind, target, label]
    properties:
      keyword: { type: string, description: 1 to 24 letters, digits, - or _; not a quick capture prefix, examples: [nas] }
      kind: { type: string, enum: [service, bookmark, widget, url, query] }
      target: { type: string, description: 'Id of the service, bookmark or widget; an http(s) address; or a search text' }
      label: { type: string, description: Display name of the target, may be empty }
  DefaultProvider: { type: object, required: [defaultProvider], properties: { defaultProvider: { type: string } } }
  SearchBar:
    type: object
    required: [openInNewTab, capturePrefixes]
    properties:
      openInNewTab: { type: boolean, description: Web results open in a new tab }
      capturePrefixes:
        type: object
        description: 'Quick capture prefixes, each 1 to 4 letters or digits and all different; "t Milch kaufen" creates a to-do'
        required: [todo, note, bookmark]
        properties:
          todo: { type: string, examples: [t] }
          note: { type: string, examples: [n] }
          bookmark: { type: string, examples: [b] }
  SearchAnswers:
    type: object
    required: [answers]
    properties:
      answers: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/SearchAnswer" } }
  SearchAnswer:
    type: object
    required: [kind, intent, title]
    properties:
      kind: { type: string, enum: [metric, status, list, text, actions] }
      intent: { type: string, examples: [system.cpu] }
      title: { type: string }
      widgetKind: { type: string, description: Widget with the details }
      at: { type: string, format: date-time, description: When the data was measured }
      value: { type: string, description: metric }
      detail: { type: string, description: metric and status }
      percent: { type: number, description: 'metric: 0-100 for a meter' }
      severity: { type: string, enum: [ok, warning, critical] }
      state: { type: string, enum: [ok, warning, error, "off"], description: status }
      text: { type: string, description: text and status }
      suggestions: { type: array, items: { type: string }, description: 'text: names to pick when the search asks back' }
      empty: { type: string, description: 'list: shown when there are no items' }
      items:
        type: array
        items:
          type: object
          required: [label, value]
          properties:
            label: { type: string }
            value: { type: string }
            state: { type: string, enum: [ok, warning, error, "off"] }
            percent: { type: number }
