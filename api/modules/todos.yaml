tags:
  - name: todos

paths:
  /api/todos/compact:
    get:
      tags: [todos]
      summary: "Compact state of the widget (#597): Open to-dos; attention while some are overdue"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CompactState" } } } }
  /api/todos:
    get:
      tags: [todos]
      summary: Open to-dos (and completed ones with done=true)
      parameters: [{ name: done, in: query, schema: { type: boolean } }, { name: source, in: query, schema: { type: string }, description: "List: empty or local = the built-in list, else the ID of a connected external list (#169)" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Todo" } } } } }
    post:
      tags: [todos]
      summary: Create a to-do
      parameters: [{ name: source, in: query, schema: { type: string }, description: "List: empty or local = the built-in list, else the ID of a connected external list (#169)" }]
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/todos/clear-completed:
    post:
      tags: [todos]
      summary: Delete all completed to-dos
      parameters: [{ name: source, in: query, schema: { type: string }, description: "List: empty or local = the built-in list, else the ID of a connected external list (#169)" }]
      security: [{ session: [], csrf: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { removed: { type: integer } }, required: [removed] } } } }
  /api/todos/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: source, in: query, schema: { type: string }, description: "List: empty or local = the built-in list, else the ID of a connected external list (#169)" }]
    put:
      tags: [todos]
      summary: Update text, due date and completion
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Todo" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Changed elsewhere since the given version (#80); for external lists the version follows the ETag, so a change in the other app wins" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [todos]
      summary: Delete a to-do
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/todos/settings/sources:
    get:
      tags: [todos]
      summary: Connected external to-do lists (#169); passwords are never returned
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TodoSource" } } } } }
    post:
      tags: [todos]
      summary: Connect a CalDAV task list or a Todoist project (the list is read once to test the connection)
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoSourceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TodoSource" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { description: The server refused the login or could not be read }
  /api/todos/settings/sources/discover:
    post:
      tags: [todos]
      summary: "Find the task lists of an account: CalDAV (from the server's DAV address, the calendar home or a list) or the Todoist projects of an API token; id may name a stored list whose password is used"
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoSourceInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { url: { type: string }, listId: { type: string }, name: { type: string } } } } } } }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { description: The server refused the login or could not be read }
  /api/todos/settings/sources/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [todos]
      summary: Change a connected list; an empty password keeps the stored one
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoSourceInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TodoSource" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "502": { description: The server refused the login or could not be read }
    delete:
      tags: [todos]
      summary: Disconnect a list (nothing is deleted on the server)
      security: [{ session: [], csrf: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/todos/settings/oauth:
    get:
      tags: [todos]
      summary: "Signing in to Microsoft, Google and TickTick (#171): the redirect address to register; empty when PUBLIC_URL is not set"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { redirectUrl: { type: string } } } } } }
  /api/todos/settings/oauth/start:
    post:
      tags: [todos]
      summary: Start a sign-in with the user's own app registration (kind, username = client ID, password = client secret); open url in a new window
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TodoSourceInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string }, state: { type: string } } } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/todos/settings/oauth/callback:
    get:
      tags: [todos]
      summary: "Where the provider sends the browser back (public: the session cookie is SameSite=Strict; the unguessable state binds it). Answers a small HTML page"
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "200": { description: Signed in, content: { text/html: { schema: { type: string } } } }
        "502": { description: The sign-in failed or the state is unknown, content: { text/html: { schema: { type: string } } } }
  /api/todos/settings/oauth/state/{state}:
    get:
      tags: [todos]
      summary: State of a sign-in while the browser signs in
      parameters: [{ name: state, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [pending, ready, failed] } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }

schemas:
  TodoInput:
    type: object
    required: [title]
    properties:
      title: { type: string, maxLength: 300 }
      due: { type: string, description: YYYY-MM-DD or empty }
      done: { type: boolean, description: "Completing a recurring to-do creates its next occurrence" }
      repeat: { $ref: "#/components/schemas/TodoRepeat", description: Omit to keep the stored rule }
      reminder: { $ref: "#/components/schemas/TodoReminder", description: Omit to keep the stored reminder }
      id: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$", description: "Create only: client-generated ID; replaying the create returns the existing to-do (#80)" }
      version: { type: integer, description: "Update only: the version the change was made from; another stored version answers 409 (#80). Omit for no check" }
  Todo:
    type: object
    properties:
      id: { type: string }
      title: { type: string }
      due: { type: string }
      done: { type: boolean }
      overdue: { type: boolean }
      position: { type: integer }
      completedAt: { type: string }
      repeat: { $ref: "#/components/schemas/TodoRepeat" }
      reminder: { $ref: "#/components/schemas/TodoReminder" }
      version: { type: integer, description: Number of stored changes (#80) }
  TodoSourceInput:
    type: object
    required: [kind, url, username]
    properties:
      id: { type: string, description: "Discover only: a stored list whose password is used when password is empty" }
      name: { type: string, maxLength: 80 }
      kind: { type: string, enum: [caldav, todoist, microsoft, google, ticktick] }
      url: { type: string, description: "CalDAV: the task list (a calendar collection with VTODO); for discover also the DAV root. Todoist: unused" }
      username: { type: string, description: "CalDAV only" }
      password: { type: string, description: "CalDAV: app password; Todoist: API token. Stored encrypted with SECRET_KEY. Empty on update keeps the stored one" }
      listId: { type: string, description: "Todoist, Microsoft, Google, TickTick: the project or list ID (from discover)" }
      oauthState: { type: string, description: "Microsoft, Google, TickTick: the state of a finished sign-in (discover, create)" }
  TodoSource:
    type: object
    properties:
      id: { type: string }
      name: { type: string }
      kind: { type: string }
      url: { type: string }
      username: { type: string }
      listId: { type: string, description: "Todoist: the project ID" }
      capabilities:
        type: object
        description: What the list supports; the UI hides the rest
        properties: { ordering: { type: boolean }, repeat: { type: boolean }, reminders: { type: boolean } }
