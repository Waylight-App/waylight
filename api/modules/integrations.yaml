# OpenAPI fragment of the integrations module (#610).
tags:
  - name: integrations

paths:
  /api/integrations/services:
    get:
      tags: [integrations]
      summary: "Services a connection can be made to (admins only): the credential fields each expects and, for services with a single address, that address"
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectionService" } } } } }
        "403": { description: Admins only, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/integrations/connections:
    get:
      tags: [integrations]
      summary: "Named connections of the instance (admins only), each with the widgets on any tab of the instance that name it in their settings (connectionId or connectionIds); credentials are never returned, only which fields are set"
      parameters:
        - { name: service, in: query, required: false, schema: { type: string }, description: Only connections of this service, e.g. immich }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Connection" } } } } }
        "403": { description: Admins only, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    post:
      tags: [integrations]
      summary: "Save a connection (admins only, at most 100, names unique per service); the service must be one of /api/integrations/services and the credential holds its required fields"
      security: [{ session: [], csrf: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "403": { description: Admins only, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "Name taken, or the connection is in use", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/integrations/choices:
    get:
      tags: [integrations]
      summary: "Connections a widget can choose (every signed-in account that edits widgets): ID, service and name, no address or credential"
      parameters:
        - { name: service, in: query, required: false, schema: { type: string }, description: Only connections of this service, e.g. immich }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConnectionChoice" } } } } }
        "403": { description: Guests, kiosk displays and API tokens, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/integrations/connections/{id}:
    put:
      tags: [integrations]
      summary: "Rename or move a connection; a new address needs the credential again"
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionChange" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "403": { description: Admins only, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Name taken, or the connection is in use", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [integrations]
      summary: "Remove a connection; one that widgets use answers 409 until confirm=true"
      security: [{ session: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: confirm, in: query, required: false, schema: { type: boolean } }
      responses:
        "204": { description: Removed }
        "403": { description: Admins only, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Name taken, or the connection is in use", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/integrations/connections/{id}/check:
    post:
      tags: [integrations]
      summary: "Try the connection with the request the service's settings page makes before saving"
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: The service accepted the connection }
        "403": { description: Admins only, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "503": { description: "The module of the service is switched off", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /api/integrations/connections/{id}/credential:
    put:
      tags: [integrations]
      summary: "Replace the credential of a connection; stays available while config as code manages the section"
      security: [{ session: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { $ref: "#/components/schemas/ConnectionCredential" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Connection" } } } }
        "403": { description: Admins only, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

schemas:
  ConnectionCredential:
    type: object
    description: "Secret fields by name, e.g. apiKey or username and password; at most 4, empty values are dropped. Write-only."
    maxProperties: 4
    additionalProperties: { type: string, maxLength: 4096 }
  ConnectionInput:
    type: object
    required: [service, name, url]
    properties:
      service: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$", description: "Service, e.g. immich or sonarr" }
      name: { type: string, maxLength: 60 }
      url: { type: string, format: uri }
      credential: { $ref: "#/components/schemas/ConnectionCredential" }
  ConnectionChange:
    type: object
    required: [name, url]
    properties:
      name: { type: string, maxLength: 60 }
      url: { type: string, format: uri }
      credential: { $ref: "#/components/schemas/ConnectionCredential" }
  ConnectionService:
    type: object
    required: [service, title, fields]
    properties:
      service: { type: string, description: "Identifier stored with a connection, e.g. homeassistant" }
      title: { type: string, description: Product name }
      fixedUrl: { type: string, description: "The only address of the service; connections always use it" }
      fields:
        type: array
        items:
          type: object
          required: [name, secret, optional]
          properties:
            name: { type: string }
            secret: { type: boolean, description: Never returned once saved }
            optional: { type: boolean }
  Connection:
    type: object
    required: [id, service, name, url, fields, values, usedBy]
    properties:
      id: { type: string }
      service: { type: string }
      name: { type: string }
      url: { type: string }
      fields: { type: array, items: { type: string }, description: Names of the credential fields that are set }
      values: { type: object, additionalProperties: { type: string }, description: "Credential fields that are not secret, e.g. the user name" }
      usedBy:
        type: array
        items:
          type: object
          required: [widgetId, tabId, kind, mine]
          properties:
            widgetId: { type: string }
            tabId: { type: string }
            kind: { type: string }
            mine: { type: boolean, description: "The widget is on a tab of the signed-in account; other accounts' tabs are not named" }
  ConnectionChoice:
    type: object
    required: [id, service, name]
    properties:
      id: { type: string }
      service: { type: string }
      name: { type: string }
